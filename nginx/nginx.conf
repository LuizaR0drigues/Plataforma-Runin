# Redireciona HTTP (porta 80) para HTTPS
server {
    listen 80;
    server_name runin.giva.icmc.usp.br;
   
    client_max_body_size 10m;

    # Mantém aberto para renovações futuras do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location /static/ {
	alias /app/staticfiles/;
	}

    location / {
        proxy_pass http://django-web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
   }
}

# Servidor Seguro HTTPS (porta 443)
server {
    listen 443 ssl;
    server_name runin.giva.icmc.usp.br;

    # Caminhos dos certificados gerados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/runin.giva.icmc.usp.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runin.giva.icmc.usp.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://django-web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
