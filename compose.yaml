services:
 django-web:

   build: . #constroi a img usando o dockerfile da pasta atual
   container_name: django-docker #nome 

   expose:
     - "8000" #acessa a porta
   
   #environment:
     #SECRET_KEY: ${SECRET_KEY}
     #DEBUG: ${DEBUG}
     #DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
     
   env_file: #leitura das variaveis
     - .env 
   volumes: #sinc os arq do projeto com o container
     - .:/app
 nginx:
   image: nginx:latest

   ports:
     - "80:80"
   depends_on:
     - django-web
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
     - ./staticfiles:/static
